name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ==================================================
  # 1. LINT
  # ==================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run lint


  # ==================================================
  # 2. UNIT TESTS
  # ==================================================
  unit-tests:
    runs-on: ubuntu-latest

    # Unit tests must wait for lint to pass.
    # They can then run in parallel with the build job.
    needs: lint

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm test


  # ==================================================
  # 3. BUILD
  # ==================================================
  build:
    runs-on: ubuntu-latest

    # Build must wait for lint to pass.
    # It can run in parallel with unit-tests.
    needs: lint

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build

      # Save dist/ so it can be used by integration-tests,
      # which runs on a separate GitHub Actions machine.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/


  # ==================================================
  # 4. INTEGRATION TESTS
  # ==================================================
  integration-tests:
    runs-on: ubuntu-latest

    # Integration tests require the build to complete first.
    needs: build

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # Retrieve the build output created by the build job.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist/

      - run: npm run test:integration


  # ==================================================
  # 5. DEPLOY STAGING
  # ==================================================
  deploy-staging:
    runs-on: ubuntu-latest

    # Staging deployment must wait for both unit tests
    # and integration tests to pass.
    needs:
      - unit-tests
      - integration-tests

    # Deploy to staging only from the main branch.
    if: success() && github.ref == 'refs/heads/main'

    timeout-minutes: 15

    steps:
      - run: echo "Deploying to staging environment"


  # ==================================================
  # 6. DEPLOY PRODUCTION
  # ==================================================
  deploy-production:
    runs-on: ubuntu-latest

    # Production deployment must wait for staging
    # deployment to complete successfully.
    needs: deploy-staging

    # Production can only be deployed from main.
    if: success() && github.ref == 'refs/heads/main'

    timeout-minutes: 15

    steps:
      - run: echo "Deploying to production environment"


  # ==================================================
  # 7. NOTIFY
  # ==================================================
  notify:
    runs-on: ubuntu-latest

    # Wait for all pipeline jobs before reporting the
    # final pipeline state.
    needs:
      - lint
      - unit-tests
      - build
      - integration-tests
      - deploy-staging
      - deploy-production

    # Notification must run even when an upstream job fails
    # or deployment jobs are skipped.
    if: always()

    timeout-minutes: 15

    steps:
      - run: echo "Pipeline notification sent"